name: Build Windows and macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
            asset: PeepoDrumKit.exe
          - runner: macos-15-intel
            os: macosx
            arch: x86_64
            asset: PeepoDrumKit-macOS-x64.dmg
          - runner: macos-latest
            os: macosx
            arch: arm64
            asset: PeepoDrumKit-macOS-arm64.dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - if: matrix.os == 'macosx'
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        run: xmake f -m release -a ${{ matrix.arch }} -c -y && xmake -v

      - name: Prepare Windows executable
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          xmake install -o build/package
          Copy-Item build/package/bin/PeepoDrumKit.exe ${{ matrix.asset }}

      - name: Prepare macOS disk image
        if: matrix.os == 'macosx'
        run: |
          codesign --force --deep --sign - build/macosx/${{ matrix.arch }}/release/PeepoDrumKit.app
          hdiutil create -volname PeepoDrumKit -srcfolder build/macosx/${{ matrix.arch }}/release/PeepoDrumKit.app -ov -format UDZO ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish direct-download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view action-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create action-build --repo "$GITHUB_REPOSITORY" --title "Action Build" --notes "Latest manually triggered Windows and macOS build."
          gh release upload action-build dist/* --repo "$GITHUB_REPOSITORY" --clobber
